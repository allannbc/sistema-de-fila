<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiosque - Emissão de Senha</title>
</head>
<body>

    <header>
        <h1>🎫 Sistema de Fila</h1>
        <p>Bem-vindo! Emita sua senha para atendimento</p>
    </header>

    <section>
        <h2>Última senha chamada</h2>
        <p><strong>A-035</strong></p>
        <p>Guichê 03 - Chamado às 14:28</p>
    </section>

    <main>
        <form action="#" method="POST">
            <fieldset>
                <legend>Dados do Cliente</legend>

                <label for="nome-cliente">Seu nome:</label>
                <input type="text" id="nome-cliente" name="nome" placeholder="Digite seu nome completo" required>

                <div>
                    <button type="submit">Emitir Senha Normal</button>
                    <button type="submit">Emitir Senha Preferencial</button>
                </div>
            </fieldset>
        </form>
    </main>

    <footer>
        <p><strong>Atendimento Preferencial:</strong> 2 preferenciais para 1 normal</p>
        <p>Para dúvidas, fale com nosso atendente</p>
    </footer>

</body>
</html>
