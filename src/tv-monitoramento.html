<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento - QueueSmart TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/public.css">
    <script type="module" src="js/tv-monitoramento.js"></script>
</head>
<body class="theme-public">

    <header class="tv-header">
        <div class="brand">
            <h1>🎫 Sistema de Fila</h1>
            <p>Agência 001</p>
        </div>
        <div class="tv-clock">
            <p><time id="time"></time></p>
            <p id="date"></p>
        </div>
    </header>

    <main>
        <section class="tv-now-serving">
            <h2>Chamando Agora</h2>
            <p class="ticket-code">-</p>
            <!-- <p class="counter">Guichê 03</p> -->
            <p class="next-up">Próximo: <strong>A-037</strong> <span class="badge badge--preferencial">Preferencial</span></p>
            <p class="counter">Prioridade: 2 preferenciais para 1 normal</p>
        </section>
    </main>

    <footer class="tv-grid">
        <section class="tv-panel tv-panel--queue">
            <h3>Próximos da Fila</h3>
            <ul class="queue-chips">
                <!-- <li>A-037 <span class="badge badge--preferencial">Pref.</span></li> -->
                <!-- <li>A-036</li> -->
                <!-- <li>A-038</li> -->
                <!-- <li>A-040 <span class="badge badge--preferencial">Pref.</span></li> -->
                <!-- <li>A-039</li> -->
                <!-- <li>A-041</li> -->
                <!-- <li>A-042</li> -->
                <!-- <li>A-043 <span class="badge badge--preferencial">Pref.</span></li> -->
            </ul>
            <p class="queue-total"></p>
        </section>

        <section class="tv-panel tv-panel--stats">
            <h3>Tempo médio de espera</h3>
            <p class="stat-value">8 min</p>
        </section>

        <section class="tv-panel tv-panel--alerts">
            <h3>Avisos</h3>
            <p>Senha A-035 chamada - Guichê 03</p>
            <p>Mantenha distanciamento social</p>
            <p>Preferenciais têm prioridade</p>
        </section>
    </footer>

</body>
</html>
